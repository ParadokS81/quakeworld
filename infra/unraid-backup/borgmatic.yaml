# Unraid -> Synology borgmatic config
#
# Reads:  infra/unraid-backup/README.md for resolved parameters, Phase 1
#         corrections, and on-box secret layout.
# On-box: /mnt/user/appdata/borgmatic/config/borgmatic.yaml (copy of this file)
#         /mnt/user/appdata/borgmatic/ssh/ (borg_syn_ed25519 + known_hosts)
#         /mnt/user/appdata/borgmatic/secrets/<name> (one file per secret, mode 600)
#
# Secrets are read via the "{credential container <name>}" syntax, which
# borgmatic resolves from /run/secrets/<name> inside the container. The
# borgmatic image's s6-overlay env handling strips docker `-e` and
# `--env-file` vars before the user command sees them; the credential
# syntax sidesteps that entirely.
#
# Repo URL uses the absolute-path double-slash form (single `/` between
# host and absolute path). The plan's `/./` template gives a relative-
# to-home URL that the `--restrict-to-path` forced command on Synology
# correctly rejects.

source_directories:
    - /mnt/src/appdata

repositories:
    - path: ssh://borg-unraid@100.112.91.72/volume1/backup/borg-appdata
      label: synology

# ssh_command replaces the plan's `-e BORG_RSH=...` (env-stripped).
# BatchMode=yes prevents fallback to password prompts that fail silently
# under borg's spawn-no-tty flow.
ssh_command: ssh -i /root/.ssh/borg_syn_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new

encryption_passphrase: "{credential container borg_passphrase}"

exclude_patterns:
    # All patterns use pp: (path-prefix) style. Borg's default fm (fnmatch)
    # style matches the EXACT path only -- so a bare /a/b excludes the dir
    # entry itself but NOT /a/b/file. pp: matches the dir and everything
    # below it.
    #
    # Plex transient state -- not backup-worthy, large turnover
    - "pp:/mnt/src/appdata/plex/Library/Application Support/Plex Media Server/Cache"
    - "pp:/mnt/src/appdata/plex/Library/Application Support/Plex Media Server/Logs"
    - "pp:/mnt/src/appdata/plex/Library/Application Support/Plex Media Server/Codecs"
    - "pp:/mnt/src/appdata/plex/Library/Application Support/Plex Media Server/Crash Reports"
    - "pp:/mnt/src/appdata/plex/Library/Application Support/Plex Media Server/Updates"
    - "pp:/mnt/src/appdata/plex/Library/Application Support/Plex Media Server/Diagnostics"
    # Plug-in Support has a sibling Caches/ dir alongside the top-level Cache.
    # Plan missed this -- found via dry-run leak count (854 paths). Other Plug-in
    # Support subdirs (Data, Databases, Preferences, Metadata Combination) stay
    # in the backup (Databases especially -- Plex's metadata SQLite lives there).
    - "pp:/mnt/src/appdata/plex/Library/Application Support/Plex Media Server/Plug-in Support/Caches"
    # DB datadirs excluded -- captured below as logical dumps (a hot file copy is torn)
    - "pp:/mnt/src/appdata/qwiki-beta/mariadb-data"
    - "pp:/mnt/src/appdata/qw-oracle-postgres"
    # Our own borgmatic config -- secrets live here, MUST NOT land in the encrypted
    # archive. Storing decryption key + SSH key inside the encrypted thing is a
    # security smell (and a privilege-escalation vector if ciphertext + passphrase
    # ever co-leak). Recovery path is escrow, not self-restore of borgmatic.
    - "pp:/mnt/src/appdata/borgmatic"

# Retention dials per locked-in spec (README "Locked dials" section)
keep_daily: 7
keep_weekly: 4
keep_monthly: 6

checks:
    - name: repository
      frequency: 1 week
    - name: archives
      frequency: 1 week

# qwiki MariaDB -- logical dump via the borgmatic 2.x `container:` option.
# borgmatic invokes docker exec internally and streams the dump through
# stdout (avoiding the cross-container /tmp/borgmatic-... write that fails
# when source and sink are in different containers' filesystems).
# password_transport: environment is required when the DB client is in a
# separate container (pipe transport can't cross container boundaries).
mariadb_databases:
    - name: all
      container: qwiki-mariadb
      username: root
      password: "{credential container qwiki_mariadb_root_pw}"
      password_transport: environment

# qw-oracle Postgres -- container option dispatches `docker exec ... pg_dumpall`
# with internal stdout streaming. POSTGRES_USER on this image is `qworacle`
# (verified against /mnt/user/appdata/qw-oracle/docker-compose.prod.yml),
# created as a superuser at init time -- required for pg_dumpall.
postgresql_databases:
    - name: all
      container: qw-oracle-postgres
      username: qworacle
      password: "{credential container qw_oracle_pg_pw}"

# SQLite DBs -- borgmatic quiesces each via the sqlite hook (no torn copies).
# Resolved list from Phase 0 Task 0.5 (README "SQLite databases" section).
# Note: bazarr is nested under db/ (not at appdata root like the other *arr apps).
# Note: quad is NOT flat-files-only -- Mumble keeps users/channels/ACLs in sqlite.
sqlite_databases:
    - name: sonarr
      path: /mnt/src/appdata/sonarr/sonarr.db
    - name: radarr
      path: /mnt/src/appdata/radarr/radarr.db
    - name: prowlarr
      path: /mnt/src/appdata/prowlarr/prowlarr.db
    - name: bazarr
      path: /mnt/src/appdata/bazarr/db/bazarr.db
    - name: sonarr-anime
      path: /mnt/src/appdata/sonarr-anime/sonarr.db
    - name: mumble
      path: /mnt/src/appdata/quad/mumble-data/mumble-server.sqlite

# Healthchecks dead-man's-switch ping (off-Unraid by design).
# Note: borgmatic's `{credential container ...}` syntax works for password-shape
# fields (encryption_passphrase, DB passwords) but does NOT resolve inside
# arbitrary URL strings -- it would land in the URL literally. So HC + Apprise
# use ${VAR} env interpolation, with the env set via the LinuxServer.io
# FILE__VAR=/run/secrets/var pattern (loaded by init-envfile at container start).
# Invocations via `docker exec borgmatic with-contenv borgmatic ...` ensure
# the env is loaded into the borgmatic process (docker exec alone bypasses s6).
healthchecks:
    ping_url: "${HC_PING_URL}"

# Apprise -> Discord on failure only (success state is Healthchecks' job).
apprise:
    services:
        - url: "${APPRISE_DISCORD}"
          label: discord
    states:
        - fail
