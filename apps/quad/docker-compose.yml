services:
  quad:
    image: ghcr.io/paradoks81/quad:${QUAD_VERSION:-latest}
    volumes:
      - ./recordings:/app/recordings
      - ./service-account.json:/app/service-account.json:ro
      - ./models:/root/.cache/huggingface/hub
    env_file: .env
    restart: unless-stopped
    ports:
      # Health endpoint -- bound to localhost so it's only reachable via SSH-then-curl.
      # Override HEALTH_BIND in .env to a Tailscale IP if you need cross-host probes.
      - "${HEALTH_BIND:-127.0.0.1}:${HEALTH_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G

  mumble:
    image: mumblevoip/mumble-server:latest
    container_name: mumble-server
    restart: unless-stopped
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    volumes:
      # /mnt/cache (not /mnt/user): murmur's SQLite DB must not run over the
      # shfs/FUSE layer -- that corrupted Plex's DB on 2026-08-13. Same bytes
      # either way (appdata is cache-resident); only the mount route differs.
      - /mnt/cache/appdata/quad/mumble-data:/data
      - /mnt/cache/appdata/quad/mumble-certs:/certs:ro   # Let's Encrypt cert, written + chowned by the acme service
    environment:
      # Trusted TLS cert -> no more self-signed / hostname-mismatch warnings.
      # MUMBLE_CONFIG_SSLCERT/SSLKEY map to murmur.ini sslCert/sslKey.
      MUMBLE_CONFIG_SSLCERT: "/certs/fullchain.pem"
      MUMBLE_CONFIG_SSLKEY: "/certs/privkey.pem"
      MUMBLE_SUPERUSER_PASSWORD: "${MUMBLE_SUPERUSER_PASSWORD:-changeme}"
      MUMBLE_CONFIG_WELCOMETEXT: "Welcome to the QuakeWorld Voice Server"
      MUMBLE_CONFIG_USERS: 50
      MUMBLE_CONFIG_BANDWIDTH: 192000   # ~160 kbit/s effective Opus after overhead; past voice transparency
      MUMBLE_CONFIG_SERVERPASSWORD: "${MUMBLE_SERVER_PASSWORD:-}"
      MUMBLE_CONFIG_REGISTERNAME: "QuakeWorld Voice"
      MUMBLE_CONFIG_ALLOWRECORDING: "true"
      MUMBLE_CONFIG_ICE: "tcp -h 0.0.0.0 -p 6502"
      MUMBLE_CONFIG_ICESECRETWRITE: "${MUMBLE_ICE_SECRET}"
    expose:
      - "6502"   # ICE API — internal Docker network only, not public

  # Issues + auto-renews the Let's Encrypt cert for mumble.slipgate.me via
  # Cloudflare DNS-01 (no inbound ports needed). Runs its own renewal cron
  # (command: daemon). On issue/renew its reloadcmd chowns the cert to
  # murmur's runtime uid (10000) and restarts mumble-server through the
  # Docker socket so murmur reloads the new cert. CF_Token / CF_Zone_ID come
  # from .env (gitignored). See DEPLOYMENT.md "Mumble TLS certificate".
  acme:
    image: neilpang/acme.sh:latest
    container_name: acme-sh
    restart: unless-stopped
    command: daemon
    volumes:
      - ./acme-data:/acme.sh
      - ./mumble-certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CF_Token: "${CF_Token}"
      CF_Zone_ID: "${CF_Zone_ID}"
