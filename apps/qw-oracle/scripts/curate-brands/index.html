<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>QW Brand Curator</title>
<style>
:root {
  --bg: #1a1a1a;
  --bg-2: #232323;
  --bg-3: #2d2d2d;
  --border: #3a3a3a;
  --fg: #e0e0e0;
  --fg-dim: #999;
  --accent: #4aa3df;
  --warn: #d49a4a;
  --good: #5fb364;
  --synth: #b58dd0;
  --bad: #d05c5c;
  --promoted: #4aa3df;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  background: var(--bg);
  color: var(--fg);
}
header {
  background: var(--bg-2);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 { margin: 0; font-size: 14px; font-weight: 600; }
header .stats { color: var(--fg-dim); font-size: 12px; }
header .actions { margin-left: auto; display: flex; gap: 8px; }
button {
  background: var(--bg-3);
  color: var(--fg);
  border: 1px solid var(--border);
  padding: 4px 10px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
}
button:hover { background: var(--border); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: #5db4ec; }
button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
button.tiny { padding: 2px 6px; font-size: 11px; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
input[type="search"], input[type="text"], select {
  background: var(--bg-3);
  color: var(--fg);
  border: 1px solid var(--border);
  padding: 5px 8px;
  font-family: inherit;
  font-size: 12px;
  border-radius: 3px;
}
input[type="search"]:focus, input[type="text"]:focus, select:focus {
  outline: none;
  border-color: var(--accent);
}
main {
  display: grid;
  grid-template-columns: 1fr 1.3fr 0.8fr;
  height: calc(100vh - 47px);
}
section { overflow: hidden; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
section:last-child { border-right: none; }
section h2 {
  margin: 0;
  padding: 10px 16px;
  background: var(--bg-2);
  font-size: 13px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
}
section h2 .count { color: var(--fg-dim); font-weight: normal; margin-left: 8px; }
.toolbar {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.toolbar .row { display: flex; gap: 6px; align-items: center; }
.toolbar .row input[type="search"] { flex: 1; }
.list { overflow-y: auto; flex: 1; padding: 8px; }
.section-header {
  font-size: 11px;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 6px 4px 2px 4px;
  margin-top: 4px;
  cursor: pointer;
  user-select: none;
}
.section-header .twist { display: inline-block; width: 10px; }
.section-body.collapsed { display: none; }
.row-item {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  margin-bottom: 4px;
  display: flex;
  flex-direction: column;
}
.row-item .row-head {
  padding: 6px 8px;
  display: grid;
  grid-template-columns: 14px 14px 1fr auto;
  gap: 6px;
  align-items: center;
  cursor: pointer;
}
.row-item .row-head:hover { background: var(--bg-3); }
.row-item.expanded { border-color: var(--accent); }
.row-item .chevron { color: var(--fg-dim); cursor: pointer; user-select: none; width: 14px; text-align: center; }
.row-item .chevron.empty { visibility: hidden; }
.row-item .meta { color: var(--fg-dim); font-size: 11px; }
.row-item .badges { display: flex; gap: 4px; flex-wrap: wrap; }
.row-detail {
  padding: 6px 14px 8px 34px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  display: none;
  font-size: 12px;
}
.row-item.expanded .row-detail { display: block; }
.row-detail .label { color: var(--fg-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px; }
.row-detail .intro { color: var(--fg); margin-top: 2px; line-height: 1.4; }
.row-detail .subpages { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.subpage-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 2px;
  font-size: 10px;
  color: var(--fg-dim);
}
.subpage-chip a { color: var(--fg-dim); text-decoration: none; }
.subpage-chip a:hover { color: var(--accent); }
.badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 2px;
  font-size: 10px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--fg-dim);
}
.badge.year { background: #2a3a4a; color: #aac; }
.badge.mode { background: #2a4a3a; color: #aca; }
.badge.compt { background: #4a3a2a; color: #cca; }
.badge.navbox { background: #2a2a4a; color: #aac; }
.badge.subpages { background: #3a2a4a; color: #cac; }
.wiki-link {
  color: var(--fg-dim);
  text-decoration: none;
  font-size: 11px;
  margin-left: 4px;
}
.wiki-link:hover { color: var(--accent); }
.brand-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  margin-bottom: 6px;
  overflow: hidden;
}
.brand-card.synthesized { border-left: 3px solid var(--synth); }
.brand-card.pre-filled { border-left: 3px solid var(--good); }
.brand-card.empty { border-left: 3px solid var(--warn); opacity: 0.7; }
.brand-card-head {
  padding: 8px 12px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
}
.brand-card-head:hover { background: var(--bg-3); }
.brand-card-head .name { font-weight: 600; }
.brand-card-head .meta { color: var(--fg-dim); font-size: 11px; margin-top: 2px; }
.brand-card-head .actions { display: flex; gap: 4px; }
.brand-card-body {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  display: none;
}
.brand-card.expanded .brand-card-body { display: block; }
.format-line { margin-bottom: 8px; }
.format-line .fl-label { color: var(--fg-dim); font-size: 11px; margin-bottom: 2px; }
.format-line .fl-members { display: flex; flex-direction: column; gap: 3px; }
.member-row {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 11px;
  overflow: hidden;
}
.member-row .member-head {
  padding: 4px 8px;
  display: grid;
  grid-template-columns: 12px 1fr auto auto auto;
  gap: 6px;
  align-items: center;
}
.member-row .chevron { color: var(--fg-dim); cursor: pointer; user-select: none; width: 12px; text-align: center; font-size: 10px; }
.member-row .chevron.empty { visibility: hidden; }
.member-row.expanded { border-color: var(--accent); }
.member-row .member-detail {
  display: none;
  padding: 4px 12px 6px 26px;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
}
.member-row.expanded .member-detail { display: block; }
.member-row .remove {
  cursor: pointer;
  color: var(--bad);
  font-weight: bold;
}
.member-row a.member-link {
  color: inherit;
  text-decoration: none;
}
.member-row a.member-link:hover {
  color: var(--accent);
}
.promoted-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--promoted);
  border-radius: 3px;
  margin-bottom: 6px;
  padding: 8px 12px;
}
.promoted-card .name { font-weight: 600; }
.promoted-card .meta { color: var(--fg-dim); font-size: 11px; margin-top: 2px; }
.promoted-card .actions { margin-top: 6px; display: flex; gap: 4px; }
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
  min-width: 400px;
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h3 { margin: 0 0 10px 0; font-size: 14px; }
.modal .field { margin-bottom: 10px; }
.modal label { display: block; font-size: 11px; color: var(--fg-dim); margin-bottom: 3px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.modal .slug-list { font-size: 11px; color: var(--fg-dim); max-height: 120px; overflow-y: auto; }
.empty-state {
  padding: 20px;
  text-align: center;
  color: var(--fg-dim);
}
.legend { display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--fg-dim); }
.legend-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <h1>QW Brand Curator</h1>
  <span class="stats" id="stats"></span>
  <div class="legend">
    <span><span class="legend-swatch" style="background: var(--good)"></span>wiki brand-page</span>
    <span><span class="legend-swatch" style="background: var(--synth)"></span>synthesized</span>
    <span><span class="legend-swatch" style="background: var(--warn)"></span>empty</span>
    <span><span class="legend-swatch" style="background: var(--promoted)"></span>promoted</span>
  </div>
  <div class="actions">
    <button id="import-btn">Import JSON</button>
    <button id="export-btn" class="primary">Export JSON</button>
    <button id="reset-btn" class="danger">Reset state</button>
  </div>
</header>

<main>
  <section class="col1">
    <h2>Wiki inventory <span class="count" id="inventory-count">0</span></h2>
    <div class="toolbar">
      <div class="row">
        <input type="search" id="filter" placeholder="filter by slug / year / mode / navbox-ref..." />
      </div>
      <div class="row">
        <input type="checkbox" id="select-all" />
        <label for="select-all" style="font-size:11px;color:var(--fg-dim)">select all visible</label>
        <input type="checkbox" id="show-assigned" style="margin-left:12px" />
        <label for="show-assigned" style="font-size:11px;color:var(--fg-dim)">show assigned</label>
        <span style="margin-left:auto;font-size:11px;color:var(--fg-dim)" id="selected-count">0 selected</span>
        <button id="bulk-assign-btn" disabled>Assign selected</button>
      </div>
    </div>
    <div class="list" id="inventory-list"></div>
  </section>

  <section class="col2">
    <h2>Rough-sorted <span class="count" id="rough-count">0</span></h2>
    <div class="toolbar">
      <div class="row">
        <input type="search" id="brand-filter" placeholder="filter buckets..." />
        <button id="new-brand-btn">+ New bucket</button>
      </div>
    </div>
    <div class="list" id="rough-list"></div>
  </section>

  <section class="col3">
    <h2>Promoted <span class="count" id="promoted-count">0</span></h2>
    <div class="list" id="promoted-list"></div>
  </section>
</main>

<input type="file" id="import-input" accept="application/json" style="display:none" />
<div id="modal-mount"></div>

<script src="brand-pre-fill.js"></script>
<script>
'use strict';

const STORAGE_KEY = 'qw-brand-curator-state-v2';
const LEGACY_STORAGE_KEY = 'qw-brand-curator-state-v1';

const prefill = window.BRAND_PREFILL;
if (!prefill) {
  const msg = document.createElement('div');
  msg.className = 'empty-state';
  msg.textContent = 'Failed to load brand-pre-fill.js. Run pre-fill.ts from the repo root first.';
  document.body.replaceChildren(msg);
  throw new Error('Missing BRAND_PREFILL');
}

const tournamentIdx = new Map();
for (const t of prefill.tournaments) tournamentIdx.set(t.slug, t);
const topLevelSlugs = new Set(prefill.tournaments.map((t) => t.slug));

function humanSlug(slug) { return slug.replace(/__/g, ' / ').replace(/_/g, ' '); }
function wikiUrl(slug) {
  // The snapshot filename collapses `!`, spaces, and other special chars to `_`,
  // but the article's title preserves them. When we have the title, build the
  // URL from it (spaces -> underscores, other chars unchanged) for accuracy.
  // Falls back to slug-with-__-as-/ when the title isn't available (orphan slugs).
  const title = prefill.article_titles && prefill.article_titles[slug];
  if (title) return 'https://www.quakeworld.nu/wiki/' + title.replace(/ /g, '_');
  return 'https://www.quakeworld.nu/wiki/' + slug.replace(/__/g, '/');
}
function subPageSuffix(slug) {
  const idx = slug.lastIndexOf('__');
  return idx >= 0 ? slug.substring(idx + 2).replace(/_/g, ' ') : slug;
}

function buildInitialState() {
  const brands = {};
  const assignments = {};
  for (const b of prefill.brands_pre_filled) {
    // Filter out any pre-filled members that aren't top-level curation units
    // (in case a navbox listed a sub-page slug).
    const validMembers = b.members.filter((m) => topLevelSlugs.has(m));
    const validFormatLines = (b.format_lines || []).map((fl) => ({
      label: fl.label,
      member_slugs: fl.member_slugs.filter((m) => topLevelSlugs.has(m)),
    })).filter((fl) => fl.member_slugs.length > 0);
    brands[b.slug] = {
      slug: b.slug,
      label: b.candidate_label,
      brand_overview_slug: b.brand_overview_slug,
      navbox_slug: b.navbox_slug,
      members: validMembers,
      format_lines: validFormatLines,
      type: b.brand_overview_slug ? 'pre-filled' : 'synthesized',
      state: 'rough-sorted',
    };
    for (const m of validMembers) assignments[m] = b.slug;
  }
  return { brands, assignments };
}

// Merge new pre-fill auto-assignments into existing state. Adds:
//   - new pre-fill brands not yet in state, with their unassigned members
//   - new members to existing pre-fill brands when those slugs aren't
//     currently assigned anywhere
// Does NOT remove or modify existing operator data. This lets pre-fill.ts
// improvements (new redirect resolutions, new sub-page rules, etc.) flow
// into the tool without requiring a state reset.
function reconcileWithPrefill(s) {
  // Slug drift handler: when pre-fill changes how it derives a bucket's slug
  // (e.g., the Hammer Time case -- prior pre-fill used navbox-name slug,
  // current pre-fill uses brand_overview-name slug after a wikilink fix),
  // match by navbox_slug instead and rename the existing state bucket.
  // Also collapses any duplicate buckets that prior reconcile created.
  let renamed = 0;
  for (const pb of prefill.brands_pre_filled) {
    if (!pb.navbox_slug) continue;
    const matches = Object.values(s.brands).filter((b) => b.navbox_slug === pb.navbox_slug);
    if (matches.length === 0) continue;
    if (matches.length === 1 && matches[0].slug === pb.slug) continue;
    matches.sort((a, b) => b.members.length - a.members.length);
    const winner = matches[0];
    for (const loser of matches.slice(1)) {
      delete s.brands[loser.slug];
      for (const m of Object.keys(s.assignments)) {
        if (s.assignments[m] === loser.slug) delete s.assignments[m];
      }
    }
    if (winner.slug !== pb.slug) {
      const oldSlug = winner.slug;
      if (s.brands[pb.slug] && s.brands[pb.slug] !== winner) continue;
      delete s.brands[oldSlug];
      winner.slug = pb.slug;
      s.brands[pb.slug] = winner;
      for (const m of Object.keys(s.assignments)) {
        if (s.assignments[m] === oldSlug) s.assignments[m] = pb.slug;
      }
      renamed += 1;
    }
  }

  let added = 0;
  let metaUpdated = 0;
  for (const pb of prefill.brands_pre_filled) {
    if (!s.brands[pb.slug]) {
      const validMembers = pb.members.filter((m) => topLevelSlugs.has(m) && !s.assignments[m]);
      s.brands[pb.slug] = {
        slug: pb.slug,
        label: pb.candidate_label,
        brand_overview_slug: pb.brand_overview_slug,
        navbox_slug: pb.navbox_slug,
        members: validMembers,
        format_lines: (pb.format_lines || []).map((fl) => ({
          label: fl.label,
          member_slugs: fl.member_slugs.filter((m) => validMembers.includes(m)),
        })).filter((fl) => fl.member_slugs.length > 0),
        type: pb.brand_overview_slug ? 'pre-filled' : 'synthesized',
        state: 'rough-sorted',
      };
      for (const m of validMembers) s.assignments[m] = pb.slug;
      added += validMembers.length;
    } else {
      const brand = s.brands[pb.slug];

      // Metadata catch-up: when pre-fill has resolved brand_overview_slug or
      // navbox_slug that the state's bucket doesn't have yet (e.g., earlier
      // pre-fill miss that's since been fixed), adopt it. Doesn't override
      // operator-set values.
      if (!brand.brand_overview_slug && pb.brand_overview_slug) {
        brand.brand_overview_slug = pb.brand_overview_slug;
        if (brand.type === 'synthesized') brand.type = 'pre-filled';
        metaUpdated += 1;
      }
      if (!brand.navbox_slug && pb.navbox_slug) {
        brand.navbox_slug = pb.navbox_slug;
        metaUpdated += 1;
      }

      for (const m of pb.members) {
        if (!topLevelSlugs.has(m)) continue;
        if (s.assignments[m]) continue;
        if (brand.members.includes(m)) continue;
        brand.members.push(m);
        s.assignments[m] = pb.slug;
        for (const flPb of pb.format_lines || []) {
          if (!flPb.member_slugs.includes(m)) continue;
          let fl = brand.format_lines.find((f) => f.label === flPb.label);
          if (!fl) {
            fl = { label: flPb.label, member_slugs: [] };
            brand.format_lines.push(fl);
          }
          if (!fl.member_slugs.includes(m)) fl.member_slugs.push(m);
        }
        added += 1;
      }
    }
  }
  if (added > 0 || metaUpdated > 0 || renamed > 0) {
    console.info(`[curate-brands] reconcile: +${added} members, ${metaUpdated} metadata, ${renamed} renamed`);
  }
  return s;
}

function migrateState(s) {
  // Drop any assignments whose slug is no longer a top-level curation unit
  // (e.g., it became a sub-page in v2 reclassification).
  const cleanAssignments = {};
  for (const [slug, brandSlug] of Object.entries(s.assignments || {})) {
    if (topLevelSlugs.has(slug)) cleanAssignments[slug] = brandSlug;
  }
  const cleanBrands = {};
  for (const [bs, b] of Object.entries(s.brands || {})) {
    cleanBrands[bs] = {
      slug: b.slug,
      label: b.label,
      brand_overview_slug: b.brand_overview_slug ?? null,
      navbox_slug: b.navbox_slug ?? null,
      members: (b.members || []).filter((m) => topLevelSlugs.has(m)),
      format_lines: (b.format_lines || []).map((fl) => ({
        label: fl.label,
        member_slugs: fl.member_slugs.filter((m) => topLevelSlugs.has(m)),
      })).filter((fl) => fl.member_slugs.length > 0),
      type: b.type ?? 'synthesized',
      state: b.state ?? 'rough-sorted',
    };
  }
  return { brands: cleanBrands, assignments: cleanAssignments };
}

let state = (function () {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      if (parsed.brands && parsed.assignments) return reconcileWithPrefill(migrateState(parsed));
    }
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      const parsed = JSON.parse(legacy);
      if (parsed.brands && parsed.assignments) return reconcileWithPrefill(migrateState(parsed));
    }
  } catch (e) {
    console.warn('localStorage parse failed', e);
  }
  return buildInitialState();
})();
// Persist the reconciled state so the merge sticks across reloads.
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}

let selected = new Set();
let expandedSlugs = new Set(); // article slugs whose row-detail is open
let expandedBrands = new Set(); // brand-card slugs whose card body is open

function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getInventory() { return prefill.tournaments; }
function getUnassigned() { return prefill.tournaments.filter((t) => !state.assignments[t.slug]); }
function $(id) { return document.getElementById(id); }

function el(tag, props, children) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'dataset') Object.assign(e.dataset, v);
      else if (k === 'on') {
        for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
      } else if (k === 'text') e.textContent = v;
      else if (k === 'value') e.value = v;
      else if (k === 'checked') e.checked = v;
      else if (k === 'placeholder' || k === 'type' || k === 'title' || k === 'href' || k === 'download' || k === 'target' || k === 'rel') e.setAttribute(k, v);
      else e.setAttribute(k, v);
    }
  }
  if (children) {
    for (const c of children) {
      if (c == null) continue;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
  }
  return e;
}

function makeBadge(cls, text) {
  return el('span', { class: `badge ${cls}`, text: String(text) });
}

function makeWikiLink(slug, text) {
  return el('a', {
    class: 'wiki-link',
    href: wikiUrl(slug),
    target: '_blank',
    rel: 'noopener',
    title: 'open on wiki',
    text: text || 'wiki',
    on: { click: (e) => e.stopPropagation() },
  });
}

function matchesFilter(t, q) {
  if (!q) return true;
  q = q.toLowerCase();
  if (t.slug.toLowerCase().includes(q)) return true;
  if (t.title && t.title.toLowerCase().includes(q)) return true;
  if (t.year && String(t.year).includes(q)) return true;
  if (t.mode && t.mode.toLowerCase().includes(q)) return true;
  if (t.competition_type && t.competition_type.toLowerCase().includes(q)) return true;
  if (t.navbox_refs && t.navbox_refs.some((r) => r.toLowerCase().includes(q))) return true;
  if (t.admin && t.admin.toLowerCase().includes(q)) return true;
  return false;
}

function brandMatchesFilter(b, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return b.label.toLowerCase().includes(q)
    || b.slug.toLowerCase().includes(q)
    || (b.brand_overview_slug && b.brand_overview_slug.toLowerCase().includes(q));
}

function renderInventoryRow(t) {
  const cb = el('input', {
    type: 'checkbox',
    checked: selected.has(t.slug),
    on: {
      click: (e) => e.stopPropagation(),
      change: (e) => {
        if (e.target.checked) selected.add(t.slug);
        else selected.delete(t.slug);
        updateSelectionUI();
      },
    },
  });

  const hasChildren = t.sub_pages && t.sub_pages.length > 0;
  const isAssigned = !!state.assignments[t.slug];
  const expanded = expandedSlugs.has(t.slug);

  const chevron = el('span', {
    class: hasChildren ? 'chevron' : 'chevron empty',
    text: expanded ? 'v' : '>',
    on: {
      click: (e) => {
        e.stopPropagation();
        if (!hasChildren) return;
        if (expanded) expandedSlugs.delete(t.slug); else expandedSlugs.add(t.slug);
        renderInventory();
      },
    },
  });

  const slugEl = el('div', { style: 'font-weight:600' }, [
    el('span', { text: humanSlug(t.slug) }),
    makeWikiLink(t.slug),
  ]);
  const titleText = t.title && t.title !== humanSlug(t.slug) ? t.title : '';
  const mainCol = el('div', null, [
    slugEl,
    titleText ? el('div', { class: 'meta', text: titleText }) : null,
    isAssigned ? el('div', { class: 'meta', style: 'color:var(--good)', text: `assigned to: ${state.brands[state.assignments[t.slug]]?.label ?? state.assignments[t.slug]}` }) : null,
  ]);

  const badges = [];
  if (t.year) badges.push(makeBadge('year', t.year));
  if (t.mode) badges.push(makeBadge('mode', t.mode));
  if (t.competition_type) badges.push(makeBadge('compt', t.competition_type));
  if (hasChildren) badges.push(makeBadge('subpages', `+${t.sub_pages.length} sub`));
  for (const r of t.navbox_refs || []) {
    const text = r.replace(/[Nn]avbox/g, '').trim() || r;
    badges.push(makeBadge('navbox', text));
  }
  const badgesEl = el('div', { class: 'badges' }, badges);

  const head = el('div', {
    class: 'row-head',
    on: {
      click: (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'A') return;
        if (e.target.classList.contains('chevron')) return;
        openAssignModal([t.slug]);
      },
    },
  }, [chevron, cb, mainCol, badgesEl]);

  const detailChildren = [];
  if (t.admin) detailChildren.push(el('div', null, [
    el('span', { class: 'label', text: 'admin: ' }),
    el('span', { text: t.admin }),
  ]));
  if (t.intro_sentence) detailChildren.push(el('div', { class: 'intro' }, [
    el('div', { class: 'label', text: 'intro' }),
    el('div', { text: t.intro_sentence }),
  ]));
  if (hasChildren) {
    detailChildren.push(el('div', { class: 'label', text: 'sub-pages' }));
    detailChildren.push(el('div', { class: 'subpages' }, t.sub_pages.map((s) =>
      el('span', { class: 'subpage-chip' }, [
        el('a', { href: wikiUrl(s), target: '_blank', rel: 'noopener', text: subPageSuffix(s) }),
      ]),
    )));
  }
  const detail = el('div', { class: 'row-detail' }, detailChildren);

  const item = el('div', {
    class: `row-item${expanded ? ' expanded' : ''}`,
    dataset: { slug: t.slug },
  }, [head, detail]);

  return item;
}

function renderInventory() {
  const filter = $('filter').value;
  const showAssigned = $('show-assigned').checked;
  const list = $('inventory-list');
  const inventory = getInventory();
  const unassigned = getUnassigned();
  const filtered = inventory.filter((t) => {
    if (!showAssigned && state.assignments[t.slug]) return false;
    return matchesFilter(t, filter);
  });

  const visibleTotal = showAssigned ? inventory.length : unassigned.length;
  $('inventory-count').textContent = `${filtered.length} / ${visibleTotal}${showAssigned ? '' : ' unassigned'}`;
  list.replaceChildren();

  if (filtered.length === 0) {
    list.appendChild(el('div', { class: 'empty-state', text: 'No tournaments match the filter.' }));
    return;
  }

  for (const t of filtered) list.appendChild(renderInventoryRow(t));
}

function makeMemberRow(slug, brandSlug) {
  const t = tournamentIdx.get(slug);
  const titleStr = t ? `${t.title} - year=${t.year} - mode=${t.mode}` : slug;
  const hasChildren = !!(t && t.sub_pages && t.sub_pages.length > 0);
  const expanded = expandedSlugs.has(slug);

  const chevron = el('span', {
    class: hasChildren ? 'chevron' : 'chevron empty',
    text: expanded ? 'v' : '>',
    on: {
      click: (e) => {
        e.stopPropagation();
        if (!hasChildren) return;
        if (expanded) expandedSlugs.delete(slug); else expandedSlugs.add(slug);
        render();
      },
    },
  });

  const nameLink = el('a', {
    class: 'member-link',
    href: wikiUrl(slug),
    target: '_blank',
    rel: 'noopener',
    text: slug,
    title: titleStr,
    on: { click: (e) => e.stopPropagation() },
  });

  const subBadge = hasChildren
    ? el('span', { style: 'color:var(--fg-dim);font-size:10px', text: `+${t.sub_pages.length} sub` })
    : el('span');
  const wikiL = makeWikiLink(slug);

  const rm = el('span', {
    class: 'remove',
    text: 'x',
    title: 'remove from bucket',
    on: {
      click: (ev) => {
        ev.stopPropagation();
        const brand = state.brands[brandSlug];
        brand.members = brand.members.filter((m) => m !== slug);
        for (const fl of brand.format_lines) {
          fl.member_slugs = fl.member_slugs.filter((m) => m !== slug);
        }
        delete state.assignments[slug];
        persist();
        render();
      },
    },
  });

  const head = el('div', { class: 'member-head' }, [chevron, nameLink, subBadge, wikiL, rm]);

  const detailChildren = [];
  if (t && t.admin) detailChildren.push(el('div', null, [
    el('span', { class: 'label', text: 'admin: ' }),
    el('span', { text: t.admin }),
  ]));
  if (t && t.intro_sentence) detailChildren.push(el('div', { class: 'intro' }, [
    el('div', { class: 'label', text: 'intro' }),
    el('div', { text: t.intro_sentence }),
  ]));
  if (hasChildren) {
    detailChildren.push(el('div', { class: 'label', text: 'sub-pages' }));
    detailChildren.push(el('div', { class: 'subpages' }, t.sub_pages.map((s) =>
      el('span', { class: 'subpage-chip' }, [
        el('a', { href: wikiUrl(s), target: '_blank', rel: 'noopener', text: subPageSuffix(s) }),
      ]),
    )));
  }
  const detail = el('div', { class: 'member-detail' }, detailChildren);

  return el('div', { class: `member-row${expanded ? ' expanded' : ''}` }, [head, detail]);
}

function renderBrandCard(b) {
  const isExpanded = expandedBrands.has(b.slug);
  const card = el('div', { class: `brand-card ${b.type}${b.members.length === 0 ? ' empty' : ''}${isExpanded ? ' expanded' : ''}` });

  const name = el('div', { class: 'name' }, [
    el('span', { text: b.label }),
    b.brand_overview_slug ? makeWikiLink(b.brand_overview_slug) : null,
  ]);
  let metaText = `${b.members.length} member${b.members.length !== 1 ? 's' : ''}`;
  if (b.brand_overview_slug) metaText += ` - brand-page: ${b.brand_overview_slug}`;
  else metaText += ` - synthesized`;
  if (b.navbox_slug) metaText += ` - navbox: ${b.navbox_slug}`;
  const meta = el('div', { class: 'meta', text: metaText });
  const mainCol = el('div', null, [name, meta]);

  const promoteBtn = el('button', { class: 'tiny primary', text: 'promote' });
  promoteBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (b.members.length === 0) {
      if (!confirm(`Promote empty bucket "${b.label}"?`)) return;
    }
    b.state = 'promoted';
    persist();
    render();
  });
  const editBtn = el('button', { class: 'tiny', text: 'edit' });
  editBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    openEditBrandModal(b.slug);
  });
  const delBtn = el('button', { class: 'tiny danger', text: 'del' });
  delBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (!confirm(`Delete bucket "${b.label}"? Members go back to unassigned.`)) return;
    for (const m of b.members) delete state.assignments[m];
    delete state.brands[b.slug];
    persist();
    render();
  });
  const actions = el('div', { class: 'actions' }, [promoteBtn, editBtn, delBtn]);

  const head = el('div', { class: 'brand-card-head' }, [mainCol, actions]);
  head.addEventListener('click', () => {
    if (expandedBrands.has(b.slug)) expandedBrands.delete(b.slug);
    else expandedBrands.add(b.slug);
    card.classList.toggle('expanded');
  });

  const body = el('div', { class: 'brand-card-body' });
  if (b.format_lines && b.format_lines.length > 0) {
    const seen = new Set();
    for (const fl of b.format_lines) {
      const flMembers = fl.member_slugs.filter((m) => b.members.includes(m));
      if (flMembers.length === 0) continue;
      for (const m of flMembers) seen.add(m);
      const flDiv = el('div', { class: 'format-line' }, [
        el('div', { class: 'fl-label', text: `${fl.label} (${flMembers.length})` }),
        el('div', { class: 'fl-members' }, flMembers.map((m) => makeMemberRow(m, b.slug))),
      ]);
      body.appendChild(flDiv);
    }
    const orphans = b.members.filter((m) => !seen.has(m));
    if (orphans.length > 0) {
      const flDiv = el('div', { class: 'format-line' }, [
        el('div', { class: 'fl-label', text: `(unassigned format-line) (${orphans.length})` }),
        el('div', { class: 'fl-members' }, orphans.map((m) => makeMemberRow(m, b.slug))),
      ]);
      body.appendChild(flDiv);
    }
  } else if (b.members.length > 0) {
    body.appendChild(el('div', { class: 'fl-members' }, b.members.map((m) => makeMemberRow(m, b.slug))));
  } else {
    body.appendChild(el('div', { class: 'empty-state', text: '(no members yet)' }));
  }

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function renderRoughSorted() {
  const filter = $('brand-filter').value;
  const list = $('rough-list');
  const allBrands = Object.values(state.brands).filter((b) => b.state !== 'promoted');
  const filtered = allBrands.filter((b) => brandMatchesFilter(b, filter));

  const multi = filtered.filter((b) => b.members.length >= 2).sort(
    (a, b) => b.members.length - a.members.length || a.label.localeCompare(b.label),
  );
  const singletons = filtered.filter((b) => b.members.length < 2).sort(
    (a, b) => a.label.localeCompare(b.label),
  );

  $('rough-count').textContent = `${filtered.length} / ${allBrands.length}`;
  list.replaceChildren();

  if (filtered.length === 0) {
    list.appendChild(el('div', { class: 'empty-state', text: 'No buckets yet. Click "+ New bucket" or assign tournaments from the inventory.' }));
    return;
  }

  // Multi-edition section
  if (multi.length > 0) {
    list.appendChild(el('div', { class: 'section-header', text: `Multi-edition (${multi.length})` }));
    const body = el('div');
    for (const b of multi) body.appendChild(renderBrandCard(b));
    list.appendChild(body);
  }

  // Singletons section (collapsible)
  if (singletons.length > 0) {
    const collapsed = singletons.length > 5; // default collapsed when there are many
    const header = el('div', { class: 'section-header' }, [
      el('span', { class: 'twist', text: collapsed ? '>' : 'v' }),
      el('span', { text: `Singletons (${singletons.length})` }),
    ]);
    const body = el('div', { class: collapsed ? 'section-body collapsed' : 'section-body' });
    for (const b of singletons) body.appendChild(renderBrandCard(b));
    header.addEventListener('click', () => {
      body.classList.toggle('collapsed');
      header.querySelector('.twist').textContent = body.classList.contains('collapsed') ? '>' : 'v';
    });
    list.appendChild(header);
    list.appendChild(body);
  }
}

function renderPromoted() {
  const list = $('promoted-list');
  const promoted = Object.values(state.brands).filter((b) => b.state === 'promoted');
  promoted.sort((a, b) => a.label.localeCompare(b.label));

  $('promoted-count').textContent = String(promoted.length);
  list.replaceChildren();

  if (promoted.length === 0) {
    list.appendChild(el('div', { class: 'empty-state', text: 'No promoted buckets yet. Promote a bucket from the middle column when its rough-sort is done.' }));
    return;
  }

  for (const b of promoted) {
    const name = el('div', { class: 'name' }, [
      el('span', { text: b.label }),
      b.brand_overview_slug ? makeWikiLink(b.brand_overview_slug) : null,
    ]);
    const noteRel = `apps/qw-oracle/curated/tournament-brand-notes/${b.slug}.md`;
    const meta = el('div', { class: 'meta' }, [
      el('div', { text: `${b.members.length} member${b.members.length !== 1 ? 's' : ''}` }),
      el('div', { text: `note: ${noteRel}` }),
    ]);

    const demoteBtn = el('button', { class: 'tiny', text: 'demote' });
    demoteBtn.addEventListener('click', () => {
      b.state = 'rough-sorted';
      persist();
      render();
    });
    const actions = el('div', { class: 'actions' }, [demoteBtn]);

    const card = el('div', { class: 'promoted-card' }, [name, meta, actions]);
    list.appendChild(card);
  }
}

function updateStats() {
  const total = prefill.tournaments.length;
  const assigned = Object.keys(state.assignments).length;
  const brandCount = Object.keys(state.brands).length;
  const promotedBrands = Object.values(state.brands).filter((b) => b.state === 'promoted').length;
  $('stats').textContent =
    `${assigned} / ${total} top-level assigned - ${brandCount} buckets (${promotedBrands} promoted)`;
}

function updateSelectionUI() {
  $('selected-count').textContent = `${selected.size} selected`;
  $('bulk-assign-btn').disabled = selected.size === 0;
}

function render() {
  renderInventory();
  renderRoughSorted();
  renderPromoted();
  updateStats();
  updateSelectionUI();
}

function openAssignModal(slugs) {
  const mount = $('modal-mount');
  const overlay = el('div', { class: 'modal-overlay' });

  const title = el('h3', { text: `Assign ${slugs.length} tournament${slugs.length !== 1 ? 's' : ''} to bucket` });

  const slugList = el('div', { class: 'slug-list', text: slugs.join(', ') });
  const slugField = el('div', { class: 'field' }, [
    el('label', { text: `Tournament${slugs.length !== 1 ? 's' : ''}:` }),
    slugList,
  ]);

  const sel = el('select', { style: 'width:100%' });
  sel.appendChild(el('option', { value: '', text: '-- select --' }));
  const brands = Object.values(state.brands)
    .filter((b) => b.state !== 'promoted')
    .sort((a, b) => b.members.length - a.members.length || a.label.localeCompare(b.label));
  for (const b of brands) {
    sel.appendChild(el('option', { value: b.slug, text: `${b.label} (${b.members.length})` }));
  }
  const brandField = el('div', { class: 'field' }, [
    el('label', { text: 'Existing bucket:' }),
    sel,
  ]);

  const newLabelInput = el('input', { type: 'text', placeholder: 'bucket label (e.g., QWSL)', style: 'width:100%' });
  const newField = el('div', { class: 'field' }, [
    el('label', { text: 'OR create new bucket:' }),
    newLabelInput,
  ]);

  const flInput = el('input', { type: 'text', placeholder: 'e.g., seasons / cups / draft', style: 'width:100%' });
  const flField = el('div', { class: 'field' }, [
    el('label', { text: 'Format-line label (optional):' }),
    flInput,
  ]);

  const cancelBtn = el('button', { text: 'Cancel' });
  const confirmBtn = el('button', { class: 'primary', text: 'Assign' });

  function close() { mount.replaceChildren(); }
  cancelBtn.addEventListener('click', close);
  confirmBtn.addEventListener('click', () => {
    const brandSlug = sel.value;
    const newLabel = newLabelInput.value.trim();
    const formatLine = flInput.value.trim();

    let targetSlug;
    if (newLabel) {
      const newSlug = newLabel.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (state.brands[newSlug]) {
        alert(`Bucket "${newSlug}" already exists.`);
        return;
      }
      state.brands[newSlug] = {
        slug: newSlug,
        label: newLabel,
        brand_overview_slug: null,
        navbox_slug: null,
        members: [],
        format_lines: [],
        type: 'synthesized',
        state: 'rough-sorted',
      };
      targetSlug = newSlug;
    } else if (brandSlug) {
      targetSlug = brandSlug;
    } else {
      alert('Pick an existing bucket or enter a new bucket label.');
      return;
    }

    const brand = state.brands[targetSlug];
    for (const slug of slugs) {
      const prev = state.assignments[slug];
      if (prev && state.brands[prev]) {
        state.brands[prev].members = state.brands[prev].members.filter((m) => m !== slug);
        for (const fl of state.brands[prev].format_lines) {
          fl.member_slugs = fl.member_slugs.filter((m) => m !== slug);
        }
      }
      if (!brand.members.includes(slug)) brand.members.push(slug);
      state.assignments[slug] = targetSlug;
      if (formatLine) {
        let fl = brand.format_lines.find((f) => f.label === formatLine);
        if (!fl) {
          fl = { label: formatLine, member_slugs: [] };
          brand.format_lines.push(fl);
        }
        if (!fl.member_slugs.includes(slug)) fl.member_slugs.push(slug);
      }
    }
    selected.clear();
    persist();
    render();
    close();
  });

  const modal = el('div', { class: 'modal' }, [
    title,
    slugField,
    brandField,
    newField,
    flField,
    el('div', { class: 'actions' }, [cancelBtn, confirmBtn]),
  ]);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  mount.replaceChildren(overlay);
  sel.focus();
}

function openEditBrandModal(brandSlug) {
  const b = state.brands[brandSlug];
  const mount = $('modal-mount');
  const overlay = el('div', { class: 'modal-overlay' });

  const labelInput = el('input', { type: 'text', value: b.label, style: 'width:100%' });
  const slugInput = el('input', { type: 'text', value: b.slug, style: 'width:100%' });
  const boInput = el('input', { type: 'text', value: b.brand_overview_slug || '', style: 'width:100%' });

  const cancelBtn = el('button', { text: 'Cancel' });
  const saveBtn = el('button', { class: 'primary', text: 'Save' });

  function close() { mount.replaceChildren(); }
  cancelBtn.addEventListener('click', close);
  saveBtn.addEventListener('click', () => {
    const newLabel = labelInput.value.trim();
    const newSlug = slugInput.value.trim();
    const newBO = boInput.value.trim() || null;
    if (!newLabel || !newSlug) { alert('Label and slug required.'); return; }
    if (newSlug !== b.slug && state.brands[newSlug]) {
      alert(`Slug "${newSlug}" already taken.`);
      return;
    }
    b.label = newLabel;
    b.brand_overview_slug = newBO;
    if (newSlug !== b.slug) {
      state.brands[newSlug] = { ...b, slug: newSlug };
      delete state.brands[b.slug];
      for (const m of state.brands[newSlug].members) state.assignments[m] = newSlug;
    }
    persist();
    render();
    close();
  });

  const modal = el('div', { class: 'modal' }, [
    el('h3', { text: `Edit bucket: ${b.label}` }),
    el('div', { class: 'field' }, [el('label', { text: 'Label:' }), labelInput]),
    el('div', { class: 'field' }, [el('label', { text: 'Slug:' }), slugInput]),
    el('div', { class: 'field' }, [el('label', { text: 'Brand overview wiki slug (optional):' }), boInput]),
    el('div', { class: 'actions' }, [cancelBtn, saveBtn]),
  ]);
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  mount.replaceChildren(overlay);
  labelInput.focus();
}

$('filter').addEventListener('input', renderInventory);
$('show-assigned').addEventListener('change', renderInventory);
$('brand-filter').addEventListener('input', renderRoughSorted);

function getVisibleInventory() {
  const filter = $('filter').value;
  const showAssigned = $('show-assigned').checked;
  return getInventory().filter((t) => {
    if (!showAssigned && state.assignments[t.slug]) return false;
    return matchesFilter(t, filter);
  });
}

$('select-all').addEventListener('change', (e) => {
  const visible = getVisibleInventory();
  if (e.target.checked) for (const t of visible) selected.add(t.slug);
  else for (const t of visible) selected.delete(t.slug);
  render();
});

$('bulk-assign-btn').addEventListener('click', () => {
  if (selected.size === 0) return;
  openAssignModal([...selected]);
});

$('new-brand-btn').addEventListener('click', () => {
  const label = prompt('New bucket label (e.g., "QWSL"):');
  if (!label) return;
  const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  if (state.brands[slug]) { alert(`Bucket "${slug}" already exists.`); return; }
  state.brands[slug] = {
    slug,
    label: label.trim(),
    brand_overview_slug: null,
    navbox_slug: null,
    members: [],
    format_lines: [],
    type: 'synthesized',
    state: 'rough-sorted',
  };
  persist();
  render();
});

$('export-btn').addEventListener('click', () => {
  const out = {
    exported_at: new Date().toISOString(),
    snapshot: prefill.snapshot,
    brands: Object.values(state.brands).map((b) => ({
      slug: b.slug,
      label: b.label,
      brand_overview_slug: b.brand_overview_slug,
      navbox_slug: b.navbox_slug,
      type: b.type,
      state: b.state ?? 'rough-sorted',
      members: b.members,
      format_lines: b.format_lines,
    })),
    assignments: state.assignments,
    unassigned: getUnassigned().map((t) => t.slug),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `brand-curation-state.json` });
  a.click();
  URL.revokeObjectURL(url);
});

$('import-btn').addEventListener('click', () => $('import-input').click());
$('import-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed.brands || !Array.isArray(parsed.brands)) {
      alert('Invalid JSON: missing `brands` array.');
      return;
    }
    if (!confirm('Replace current state with imported JSON? Local edits will be discarded.')) return;
    const newBrands = {};
    for (const b of parsed.brands) newBrands[b.slug] = b;
    const newState = { brands: newBrands, assignments: parsed.assignments || {} };
    state = migrateState(newState);
    selected.clear();
    expandedSlugs.clear();
    expandedBrands.clear();
    persist();
    render();
  } catch (err) {
    alert('Failed to parse JSON: ' + err.message);
  } finally {
    e.target.value = '';
  }
});

$('reset-btn').addEventListener('click', () => {
  if (!confirm('Reset all curation state to fresh pre-fill? This wipes localStorage.')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(LEGACY_STORAGE_KEY);
  state = buildInitialState();
  selected.clear();
  expandedSlugs.clear();
  expandedBrands.clear();
  render();
});

render();
</script>

</body>
</html>
