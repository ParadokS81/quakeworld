  # -- Crosshair --------------------------------------------------------

  - cvar: crosshairimage
    category: crosshair
    path_pattern: "crosshairs/{value}"
    load_trigger: on_demand
    source_ref: "r_draw.c:201"
    notes: "Draw_CachePicSafe(va(\"crosshairs/%s\", s)); extension resolved by the cache layer."

  # -- Skybox -----------------------------------------------------------

  - cvar: r_skyname
    category: skybox
    path_pattern: "env/{value}_{face}.tga"
    load_trigger: on_map_load
    source_ref: "cl_skygroups.c:255"
    notes: >
      R_SetSky(r_skyname.string). Engine searches both env/ and gfx/env/
      and tries <name><face> and <name>_<face> permutations; this pattern
      shows the canonical shape. Face ∈ {ft,bk,lf,rt,up,dn}.

  # -- Console background / charset ------------------------------------

  - cvar: scr_conpicture
    category: hud_overlay
    path_pattern: "gfx/{value}"
    load_trigger: startup
    source_ref: "r_draw.c:1041"
    notes: "Default value 'conback'; R_LoadPicImage(va(\"gfx/%s\", ...))."

  - cvar: gl_consolefont
    category: charset
    path_pattern: "textures/charsets/{value}"
    load_trigger: startup
    source_ref: "r_draw_charset.c:714"
    notes: >
      Draw_LoadCharset(gl_consolefont.string); value 'original' restores
      the 8bit font embedded in gfx.wad instead of loading an external
      charset.

  - cvar: font_facepath
    category: other
    path_pattern: "{value}"
    load_trigger: startup
    source_ref: "fonts.c:586"
    notes: "TrueType file; value is an absolute-or-relative path, not templated."

  # -- HUD group backgrounds -------------------------------------------

  - cvar: hud_group1_picture
    category: hud_overlay
    path_pattern: "gfx/{value}"
    load_trigger: on_demand
    source_ref: "hud_groups.c:137"
    notes: "snprintf(pic_path, HUD_GROUP_PIC_BASEPATH, newpic) where BASEPATH = \"gfx/%s\"."

