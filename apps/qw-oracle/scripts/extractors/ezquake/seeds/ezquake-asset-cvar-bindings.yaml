  # -- Demo directory --------------------------------------------------

  - cvar: demo_dir
    category: demo
    path_pattern: "{value}/"
    load_trigger: on_demand
    source_ref: "cl_demo.c:2326"
    notes: >
      FS_LegacyDir(demo_dir.string) — directory under which demos are
      listed and read on playback. Also used for demo recording output.
