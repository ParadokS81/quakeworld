# FTE search-path and archive-precedence rules.
#
# Describes engine behavior that no single call site captures in isolation.
# Each rule cites a source_ref; Task 1.10 verifier confirms the cited line still
# resolves to the named function. Rule order within (project, version, rule_kind)
# is given by ordinal (lower = applied first / more fundamental).
#
# Rule kinds:
#   search_path         -- how directories are stacked and traversed
#   archive_precedence  -- how archives (pak/pk3/pk4) relate to each other and loose files
#   gamedir_behavior    -- how `gamedir`/`-game`/mod-dir swapping affects the stack
#   cmdline_override    -- how CLI params reshape the stack at startup
#
# Source lines are pinned against fteqw head at authoring time (build-6698,
# SHA 35843773). If Task 1.10 verifier reports source_verified=0 for any row,
# the seed is stale -- fix it before loading.
project: fte
version: build-6698
path_rules:

  # ---- search_path ---------------------------------------------------------

  - canonical_id: fte:path_rule:fte_id1_qw_base_stack
    rule_kind: search_path
    ordinal: 1
    description: >
      For the QuakeWorld game (manifest selector "-quake"/"q1"), FTE's
      gamemode_info[] entry defines the base game directory set as id1/,
      qw/, and *fte/ (the asterisk marks a private gamedir). When the
      manifest selector resolves, FS_Manifest_SetDefaultSettings copies
      the gamepath array into the manifest. FS_ChangeGame later iterates
      gamepath[] calling FS_AddGameDirectory for each base dir; each call
      pushes the dir to the head of com_searchpaths via FS_AddPathHandle.
      Effective lookup order is *fte > qw > id1 (last added is highest
      precedence in the LIFO stack).
    source_ref: "engine/common/fs.c:1302"

  - canonical_id: fte:path_rule:searchpath_lifo_lookup
    rule_kind: search_path
    ordinal: 2
    description: >
      com_searchpaths is a singly-linked list traversed head-first.
      FS_FLocateFile walks `for (search = com_searchpaths ; search ;
      search = search->next)` and returns the first FindFile match. Every
      FS_AddPathHandle call inserts at the head, so the most recently
      added directory or archive is checked first.
    source_ref: "engine/common/fs.c:2246"

  - canonical_id: fte:path_rule:base_searchpaths_snapshot
    rule_kind: search_path
    ordinal: 3
    description: >
      After mounting all base gamepath entries (id1, qw, *fte for QW),
      FS_ChangeGame snapshots com_searchpaths into com_base_searchpaths.
      Subsequent `gamedir` swaps unwind paths above this snapshot but
      preserve the base stack -- so id1, qw, *fte always remain mounted.
    source_ref: "engine/common/fs.c:5391"

  # ---- archive_precedence --------------------------------------------------

  - canonical_id: fte:path_rule:archive_kind_registration_order
    rule_kind: archive_precedence
    ordinal: 1
    description: >
      FS_RegisterDefaultFileSystems registers archive backends in this
      order: dz, pak, pk3, pk4, pkz, pkx, iwd, apk, zip, kpf. Later-
      registered kinds are scanned later in FS_AddDataFiles, and each
      scan's matches push onto the LIFO searchpath stack. Net effect for
      QW: pk4 > pk3 > pak. Quake 1 / QuakeWorld installs rarely use pk4;
      in practice this collapses to pk3 > pak.
    source_ref: "engine/common/fs.c:8522"

  - canonical_id: fte:path_rule:pak_numbered_ascending_load
    rule_kind: archive_precedence
    ordinal: 2
    description: >
      Within a game directory FS_AddDataFiles loads pak0.<ext>, pak1.<ext>,
      pak2.<ext>, ... in numeric-ascending order until one is missing.
      Because each is pushed to the head of com_searchpaths on load,
      higher-numbered paks end up earlier in lookup order. Effect:
      pak1.pak overrides pak0.pak for same-name entries. Same loop runs
      per archive kind (pak, pk3, pk4).
    source_ref: "engine/common/fs.c:4194"

  - canonical_id: fte:path_rule:pak_lst_explicit_ordering
    rule_kind: archive_precedence
    ordinal: 3
    description: >
      If a file named `pak.lst` exists in the game directory,
      FS_AddDataFiles parses it for an explicit pak-load ordering before
      the numbered-pak scan. Names listed there are loaded by FS_AddSingleDataFile
      in file order. Unlike ezQuake's pak.lst (which suppresses the wildcard
      scan entirely), FTE's pak.lst is additive: numbered + manifest +
      wildcard scans all still run after the pak.lst entries.
    source_ref: "engine/common/fs.c:4147"

  - canonical_id: fte:path_rule:wildcard_archives_after_numbered
    rule_kind: archive_precedence
    ordinal: 4
    description: >
      After loading the numbered pakN.<ext> series and any manifest-
      declared packages, FS_AddDataFiles enumerates `*.<ext>` in the same
      directory and pushes each match to the head of com_searchpaths.
      Wildcard-discovered archives sit higher on the stack than numbered
      paks of the same extension and so take precedence.
    source_ref: "engine/common/fs.c:4243"

  - canonical_id: fte:path_rule:archive_vs_loose_files
    rule_kind: archive_precedence
    ordinal: 5
    description: >
      FS_AddGameDirectory pushes the directory itself onto com_searchpaths
      (via FS_AddPathHandle). FS_AddPathHandle then triggers FS_AddDataFiles
      which pushes archives within that directory on top. Net effect:
      archives override loose files in the same directory.
    source_ref: "engine/common/fs.c:4315"

  # ---- gamedir_behavior ----------------------------------------------------

  - canonical_id: fte:path_rule:gamedir_change_via_changegame
    rule_kind: gamedir_behavior
    ordinal: 1
    description: >
      `gamedir <mod>` and `-game <mod>` both route through FS_ChangeGame,
      which loads a fresh manifest (or alters the existing one) and
      rebuilds the searchpath stack. Old searchpaths above
      com_base_searchpaths are freed; the base stack survives. The new
      mod directory is mounted via FS_AddGameDirectory on top of the base.
    source_ref: "engine/common/fs.c:6797"

  - canonical_id: fte:path_rule:gamedir_fallthrough_to_base
    rule_kind: gamedir_behavior
    ordinal: 2
    description: >
      After mounting a mod dir, lookups for assets missing in the mod
      fall through to the next searchpath entries -- which are the base
      stack (qw, id1 for QW). This works automatically because
      FS_FLocateFile's LIFO walk continues past head when FindFile misses;
      mod directory was pushed last so it's consulted first, but absent
      matches fall through to the next entry.
    source_ref: "engine/common/fs.c:2246"

  # ---- cmdline_override ----------------------------------------------------

  - canonical_id: fte:path_rule:basedir_cmdline
    rule_kind: cmdline_override
    ordinal: 1
    description: >
      `-basedir <path>` overrides the auto-detected base directory (where
      id1/, qw/, and *fte/ are searched). Checked during init; when present,
      base game directories are resolved relative to this value.
    source_ref: "engine/common/fs.c:6869"

  - canonical_id: fte:path_rule:game_cmdline
    rule_kind: cmdline_override
    ordinal: 2
    description: >
      `-game <mod>` (or `+gamedir <mod>` at the console) calls FS_ChangeGame
      to mount the named mod gamedir on top of the base stack. Equivalent
      to running `gamedir <mod>` immediately after init.
    source_ref: "engine/common/fs.c:6461"

  - canonical_id: fte:path_rule:quake_manifest_selector
    rule_kind: cmdline_override
    ordinal: 3
    description: >
      `-quake` selects FTE's QuakeWorld game manifest (id1/qw/*fte gamepath
      set, QUAKEPROT protocol, q1 mode key). FTE supports multiple game
      manifests via cmdline selectors (-quake, -quake2, -quake3, -hexen2,
      etc.); -quake is the QW-relevant one. The manifest's installation
      string is matched against gamemode_info[i].argname inside
      FS_Manifest_SetDefaultSettings, which then copies the gamepath set
      into the manifest.
    source_ref: "engine/common/fs.c:1298"
