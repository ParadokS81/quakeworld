# Cluster 5: mechanics (53 rows total)
mechanics:
  constants:
    - name: sv_gravity_default
      value_numeric: 800
      source_ref: world.qc:182
      props:
        scope: worldspawn_default
        cvar_name: sv_gravity
        e1m8_override: 100
        e1m8_override_source_ref: world.qc:180
      notes: per-map override on e1m8 (boss fight). The cvar itself is tunable by the engine; this row captures the QC-side default set in worldspawn.

    - name: rocket_jump_multiplier_default
      value_numeric: 1
      source_ref: defs.qc:443
      props:
        scope: worldspawn_default
        gate: infokey_rj
        override_gate_source_ref: client.qc:517
        applies_to: self_damage_knockback
      notes: rj=0 disables rocket jumping; rj=1 default; some servers set rj=2. The default of 1 is established by the global declaration `float rj = 1` at defs.qc:443; client.qc:517 is the conditional override gate that only fires when the server infokey rj is non-zero.

    - name: splash_falloff_gradient
      value_text: points_eq_damage_minus_half_distance_from_blast_center
      source_ref: combat.qc:275
      props:
        scope: global_combat_rule
        falloff_formula: points = damage - 0.5 * distance(blast_origin, target_center)
        distance_term_source_ref: combat.qc:272
        radius_formula: damage_plus_40
        radius_source_ref: combat.qc:258
        negative_points_gate: damage_delivered_only_if_points_gt_0
        negative_points_gate_source_ref: combat.qc:279
        applies_to: [rocket_launcher, grenade_launcher, rocket, grenade]
        beam_twin_source_ref: combat.qc:312
        beam_twin_note: T_BeamDamage (LG discharge) uses the same linear falloff (distance term combat.qc:309)
      notes: >
        Radius damage is NOT flat. T_RadiusDamage delivers
        points = damage - 0.5*distance from the blast center; targets whose
        points come out non-positive simply take nothing (delivery is gated
        on points > 0 at combat.qc:279). NOTE the source order: the clamp at
        combat.qc:273-274 bounds the DISTANCE TERM before the subtraction
        (dead code in practice -- vlen is non-negative); it is NOT a
        delivered-damage clamp. The per-weapon splash_damage (e.g. RL 120)
        is the MAXIMUM at zero distance; delivered splash decreases linearly
        to the edge of the damage+40 radius. The "splash flat 120" wording
        on the rocket and grenade rows is the nominal max, not the value
        delivered at range.

    - name: self_splash_half_damage
      value_numeric: 0.5
      source_ref: combat.qc:278
      props:
        scope: global_combat_rule
        rule: if_target_eq_attacker_then_points_times_0.5
        applies_to: rocket_jump_and_self_splash
        beam_twin_source_ref: combat.qc:314
        beam_twin_note: T_BeamDamage applies the same self-halving
        interaction_with_rj: separate_from_rocket_jump_multiplier_infokey_rj
      notes: >
        The radius damage you take from your own rocket or grenade is half
        what an enemy at the same distance takes (combat.qc:278). This is the
        QC-side self-damage reduction that makes rocket-jumping survivable;
        the rj infokey knockback multiplier (constant
        rocket_jump_multiplier_default) is a separate scalar.

    - name: lg_direct_zvelocity_boost
      value_numeric: 400
      source_ref: weapons.qc:499
      props:
        scope: global_combat_rule
        applies_to: lightning_gun_direct_hit_on_player
        condition: other_classname_eq_player
        condition_source_ref: weapons.qc:498
      notes: a lightning-gun bolt hitting a player adds +400 to the target's z-velocity (a small upward pop); only applied when the struck entity is a player.

    - name: lg_water_discharge_damage_per_cell
      value_text: thirtyfive_times_cells_radius_damage
      source_ref: weapons.qc:555
      props:
        scope: global_combat_rule
        formula: T_RadiusDamage(self, self, 35 * ammo_cells)
        trigger: firing_lightning_gun_while_waterlevel_gt_1
        dumps_all_cells: true
        dm4_variant_note: dm4 uses a fixed 4000 self-damage on a random low-roll branch (dm_mode_rules.dm4_rules.lg_water_self_damage); 35*cells is the base non-dm4 discharge
      notes: firing the LG underwater discharges all cells and deals 35*cells radius damage centered on the shooter -- the classic "LG in water kills you". Empties ammo_cells to 0.

    - name: ssg_last_shell_fires_shotgun
      value_text: super_shotgun_falls_back_to_shotgun_at_one_shell
      source_ref: weapons.qc:324
      props:
        scope: global_combat_rule
        condition: currentammo_eq_1
        fallback_call: W_FireShotgun
        fallback_source_ref: weapons.qc:326
      notes: the super shotgun needs 2 shells; with exactly 1 shell left it fires a single-barrel shotgun shot instead of failing. Player-visible behavior on the last shell.

    - name: best_weapon_drops_lg_in_water
      value_text: W_BestWeapon_excludes_lightning_when_waterlevel_gt_1
      source_ref: weapons.qc:944
      props:
        scope: global_combat_rule
        condition: waterlevel_le_1_required_for_lg_autoselect
        also_requires: ammo_cells_ge_1
      notes: auto weapon-select (best-weapon) will not pick the lightning gun when the player is submerged (waterlevel > 1), to avoid the self-discharge; it falls through to the next best weapon.

    - name: timelimit_unit_minutes
      value_text: timelimit_cvar_is_minutes_multiplied_by_60
      source_ref: world.qc:350
      props:
        scope: match_rule
        cvar_name: timelimit
        conversion: seconds_eq_cvar_timelimit_times_60
      notes: the timelimit cvar is specified in MINUTES; StartFrame multiplies by 60 to get the internal seconds value. A server admin setting timelimit 10 means a 10-minute match.
  env_hazards:
    - name: lava
      source_ref: client.qc:825
      props:
        damage_per_tick_formula: 10_times_waterlevel
        damage_source_ref: client.qc:825
        tick_seconds_default: 0.2
        tick_seconds_default_source_ref: client.qc:823
        tick_seconds_with_biosuit: 1
        tick_seconds_with_biosuit_source_ref: client.qc:821
        biosuit_blocks: false
        biosuit_attenuates_via: radsuit_finished_gt_time
        biosuit_source_ref: client.qc:820
      notes: ticks 5x more often than slime; biosuit only slows ticks (does NOT block).

    - name: slime
      source_ref: client.qc:833
      props:
        damage_per_tick_formula: 4_times_waterlevel
        damage_source_ref: client.qc:833
        tick_seconds: 1
        tick_seconds_source_ref: client.qc:832
        biosuit_blocks: true
        biosuit_source_ref: client.qc:830
      notes: biosuit fully blocks slime damage.

    - name: drowning
      source_ref: client.qc:797
      props:
        grace_seconds: 12
        grace_source_ref: client.qc:466
        air_refill_when_waterlevel_lt_3: true
        air_refill_source_ref: client.qc:790
        starts_when: air_finished_lt_time
        starts_source_ref: client.qc:793
        damage_initial: 2
        damage_initial_source_ref: client.qc:467
        damage_increment_per_tick: 2
        damage_increment_source_ref: client.qc:797
        damage_cap: 10
        damage_cap_source_ref: client.qc:799
        tick_seconds: 1
        tick_seconds_source_ref: client.qc:801
        biosuit_blocks: true
        biosuit_source_ref: client.qc:1089
      notes: >
        12s grace, then 1s ticks. self.dmg starts at 2 (initial water damage,
        client.qc:467), increments +2 each tick (client.qc:797), and when it
        exceeds 15 it resets to 10 (client.qc:799). So delivered damage climbs
        4,6,8,10,12,14 then oscillates 10,12,14 -- the per-tick maximum is 14
        and 10 is the post-overflow floor. The earlier single
        damage_source_ref pointed only at the increment line.

    - name: fall_damage
      source_ref: client.qc:1146
      props:
        grace_velocity: -300
        grace_velocity_source_ref: client.qc:1139
        damage_threshold_velocity: -650
        damage_threshold_source_ref: client.qc:1143
        damage: 5
        damage_source_ref: client.qc:1146
        water_absorbs: true
        water_absorbs_source_ref: client.qc:1141
        deathtype: falling
      notes: flat 5 dmg above -650 velocity; water absorbs entirely.

    - name: crush_squish
      source_ref: plats.qc:114
      props:
        deathtype: squish
        delivery: T_Damage_with_squish_dtype
        squish_assigners:
          - plats.qc:114
          - plats.qc:227
          - doors.qc:34
          - doors.qc:683
        obituary_check_source_ref: client.qc:1268
      notes: damage value comes from the crushing entity (door/plat dmg field); often instakill if dmg unset. plats.qc:114 is the first concrete deathtype="squish" assignment; client.qc:1268 is the obituary-check site (where the deathtype string is read), not where it's set.

    - name: gib_threshold
      source_ref: player.qc:598
      props:
        threshold_health: -40
        models: [h_player, gib1, gib2, gib3]
        models_source_ref: player.qc:521
        gib_function: GibPlayer
        gib_function_source_ref: player.qc:600
        explosive_obituary_switch_source_ref: client.qc:1361
        lava_threshold_health: -15
        lava_threshold_source_ref: client.qc:1452
        gib_scatter_velocity_overkill_scaled: true
        gib_scatter_tiers: dm_gt_minus50_x0.7 / dm_gt_minus200_x2 / else_x10
        gib_scatter_tier_source_refs: [player.qc:465, player.qc:468, player.qc:470, player.qc:473, player.qc:476]
        gib_entity_lifetime_seconds: 10_to_20
        gib_entity_lifetime_source_ref: player.qc:497
      notes: >
        When health drops below -40 the player explodes into gibs instead of
        ragdoll (player.qc:598; the obituary text switches to the gib variant at
        client.qc:1361). Lava deaths gib at a lower bar, health < -15
        (client.qc:1452). Gib scatter velocity scales with overkill:
        VelocityForDamage multiplies the base by 0.7x above -50, 2x above -200,
        and 10x below -200 (player.qc:465-476); gibs persist 10-20s
        (player.qc:497). Lives in player.qc, not client.qc.

    - name: trigger_hurt
      source_ref: triggers.qc:548
      props:
        delivery: hurt_touch_calls_T_Damage_with_self_dmg
        damage_call_source_ref: triggers.qc:553
        default_damage: 5
        default_damage_source_ref: triggers.qc:571
        damage_value_origin: per_instance_set_by_mapper_in_entity_properties
        retrigger_seconds: 1
        retrigger_source_ref: triggers.qc:555
        applies_armor: true
        applies_pent: true
        common_uses: [void_brush_at_map_bottom, custom_hazard_areas, mapper_traps]
        relation_to_engine_out_of_world_z: well_built_maps_place_high_dmg_trigger_hurt_above_engine_z_floor_so_QC_path_runs_first
      notes: |
        Damage-dealing brush placed by the mapper. self.dmg is per-instance: a void brush
        with dmg=1000 instakills, a low-damage hazard area at default dmg=5 is just
        attrition. Unlike telefrag/exit_level_kill (50000 dmg), trigger_hurt damage goes
        through normal T_Damage so armor and pent both apply. There is no QC handler for
        engine-level out-of-world Z; instead, mappers put a trigger_hurt brush above the
        engine's hard Z floor to catch players first. This is what kills you when you
        jump into the void on most maps.
