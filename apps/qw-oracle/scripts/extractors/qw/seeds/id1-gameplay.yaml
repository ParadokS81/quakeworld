# Cluster 4: monsters (15 rows)
#
# id1 single-player monster stats. kind='monster', gameplay_source_id='id1',
# ungated (ruleset_gate_json defaults to '{}'). Source: the original Quake
# v1.06 QuakeC tree acquired by Phase 0 at /research/repos/QuakeC-releases/progs/
# (mirror + commit + date recorded on gameplay_source.notes above).
#
# CITATION FORM (plan D7): monster refs use the LEADING-SLASH (repo-root-
# relative) form because they cite the v1.06 tree, NOT the id1 source_root
# (QW/progs/, which has single-player stripped -- it holds no monster QC).
# The existing weapon/item/mechanic refs stay bare (source_root-relative).
# Both forms resolve under the D7 two-form rule; the citation gate handles
# the leading slash.
#
# FENCE (plan D6): the 13 ktx rows that share these classnames live under
# gate {"mode":"bloodfest"} with gameplay_source_id='ktx' -- a DIFFERENT
# fact-family (spawn economy: hp_for_kill / armor_for_kill / array_position)
# and source. These id1 rows never collide (natural key differs on
# gameplay_source_id AND gate). search_gameplay_entities for monster_shambler
# returns both: combat stats here, bloodfest economy there.
#
# UNIFORM PROP VOCABULARY (applied to every row -- plan D6):
#   health        int   spawn HP (health_source_ref sibling); null if no depletable HP (bosses)
#   gib_health    int   gib death threshold (gib_health_source_ref); null if no distinct gib path
#   attacks       list  one cited map per attack:
#                         name / type (melee|ranged_projectile|ranged_hitscan|ranged_beam)
#                         damage (dice/formula as written) + damage_source_ref
#                         projectile / projectile_speed / projectile_speed_source_ref (null for melee/beam)
#                         attack_fn_source_ref
#   behaviors     list  cited maps {name, value, source_ref} for special rules
# Wiki cross-check results are NEVER row props (plan D2/D15) -- see phase-2-findings.md.
monsters:
  - name: monster_army
    classname: monster_army
    source_ref: /research/repos/QuakeC-releases/progs/soldier.qc:284
    props:
      health: 30
      health_source_ref: /research/repos/QuakeC-releases/progs/soldier.qc:313
      gib_health: -35
      gib_health_source_ref: /research/repos/QuakeC-releases/progs/soldier.qc:259
      attacks:
        - name: shotgun_burst
          type: ranged_hitscan
          damage: "4 per pellet x 4 pellets (16 max)"
          damage_source_ref: /research/repos/QuakeC-releases/progs/soldier.qc:220
          projectile: null
          projectile_speed: null
          projectile_speed_source_ref: null
          attack_fn_source_ref: /research/repos/QuakeC-releases/progs/soldier.qc:205
      behaviors:
        - name: drops_backpack_on_death
          value: "5 shells"
          source_ref: /research/repos/QuakeC-releases/progs/soldier.qc:228
        - name: lead_shot_aim
          value: "aims slightly behind the player's current position to punish straight-line dodging"
          source_ref: /research/repos/QuakeC-releases/progs/soldier.qc:217
    notes: >
      Grunt: 30 hp hitscan trooper. Fires a 4-pellet shotgun burst (16 max if all
      pellets connect) and drops a 5-shell backpack on death. Values cited into the
      v1.06 tree; wiki cross-check in phase-2-findings.md.
